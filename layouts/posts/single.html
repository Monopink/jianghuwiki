{{ define "main" }}
<article class="markdown jw-article jw-post">
  <h1>{{ partial "docs/title" . }}</h1>
  {{ partial "docs/post-meta" . }}
  <div class="jw-post-content markdown-inner" data-reading-content>
    {{- .Content -}}
  </div>
</article>
{{ end }}

{{ define "breadcrumbs" }}
<!-- -->
{{ end }}

{{ define "toc" }}
  {{ partial "docs/toc" . }}
{{ end }}

{{ define "footer" }}
<!-- Post pages have no footer. -->
{{ end }}
