{{ if default true .Site.Params.BookSearch }}
<dialog class="jw-search-dialog" id="jw-site-search" aria-labelledby="jw-site-search-title">
  <header><h2 id="jw-site-search-title">站内搜索</h2><button class="jw-close-icon" type="button" data-search-close aria-label="关闭站内搜索">{{ partial "docs/close-icon" . }}</button></header>
  <form role="search"><input id="jw-site-search-input" type="search" aria-label="站内搜索关键词" maxlength="128" autocomplete="off" autofocus /></form>
  <p class="jw-search-status" role="status" aria-live="polite"></p>
  <ol class="jw-search-results" aria-label="站内搜索结果"></ol>
</dialog>
{{ end }}
