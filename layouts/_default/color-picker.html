{{ define "main" }}
  {{ $css := resources.Get "styles/color-picker.css" | resources.Minify | resources.Fingerprint }}
  {{ $script := resources.Get "tools/color-picker.js" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <article class="markdown book-article toolbox-page color-picker-page">
    <h1>{{ .Title }}</h1>
    <section class="color-picker-workbench" aria-label="颜色选择器">
      <div class="color-picker-editor">
        <div class="color-picker-canvas-wrap"><canvas class="color-picker-field" width="360" height="280" aria-label="二维颜色选择区域"></canvas><div class="color-picker-canvas-marker" aria-hidden="true"></div></div>
        <div class="color-picker-strip-wrap"><canvas class="color-picker-strip" width="32" height="280" aria-label="当前通道颜色条"></canvas><div class="color-picker-strip-marker" aria-hidden="true"></div></div>
      </div>
      <div class="color-picker-controls">
        <fieldset class="color-picker-group"><legend>HSB</legend>
          <label class="color-picker-channel"><input type="radio" name="color-channel" value="h" checked><span>H</span><input data-color-input="h" type="number" min="0" max="360" step="1" aria-label="色相"></label>
          <label class="color-picker-channel"><input type="radio" name="color-channel" value="s"><span>S</span><input data-color-input="s" type="number" min="0" max="100" step="1" aria-label="饱和度"></label>
          <label class="color-picker-channel"><input type="radio" name="color-channel" value="b"><span>B</span><input data-color-input="b" type="number" min="0" max="100" step="1" aria-label="明度"></label>
        </fieldset>
        <fieldset class="color-picker-group"><legend>RGB</legend>
          <label class="color-picker-channel"><input type="radio" name="color-channel" value="r"><span>R</span><input data-color-input="r" type="number" min="0" max="255" step="1" aria-label="红色"></label>
          <label class="color-picker-channel"><input type="radio" name="color-channel" value="g"><span>G</span><input data-color-input="g" type="number" min="0" max="255" step="1" aria-label="绿色"></label>
          <label class="color-picker-channel"><input type="radio" name="color-channel" value="b-rgb"><span>B</span><input data-color-input="b-rgb" type="number" min="0" max="255" step="1" aria-label="蓝色"></label>
        </fieldset>
        <label class="color-picker-hex"><span>HEX</span><input data-color-input="hex" type="text" value="#FF0000" spellcheck="false" maxlength="7" aria-label="HEX 颜色值"></label>
      </div>
    </section>
    <section class="color-picker-palette" aria-label="色板">
      <div class="color-picker-palette-list">
        <div class="color-picker-palette-item color-picker-swatch-new" data-preview-swatch="new">
          <span class="color-picker-palette-values"><span data-copy-value="new-hex" tabindex="0" role="button"></span><span data-copy-value="new-rgb" tabindex="0" role="button"></span></span>
          <button class="color-picker-palette-add" type="button" data-add-palette title="添加当前颜色" aria-label="添加当前颜色">+</button>
        </div>
        <div class="color-picker-palette-custom" data-color-palette></div>
      </div>
    </section>
  </article>
  <script type="module" src="{{ $script.RelPermalink }}"></script>
{{ end }}
