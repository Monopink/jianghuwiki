name: Build Hugo site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.139.4
          extended: true

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Build site
        run: hugo --gc --minify --printPathWarnings --printUnusedTemplates
