<div class="flex flex-wrap justify-between">
  <div>
    {{ if .GitInfo }}
      {{- $date := partial "docs/date" (dict "Date" .GitInfo.CommitDate "Format" .Site.Params.BookDateFormat) -}}
      <span class="flex align-center">
        <time datetime="{{ .GitInfo.CommitDate.Format "2006-01-02T15:04:05Z07:00" }}">{{ $date }}</time>
      </span>
    {{ end }}
  </div>

  <div>
    {{ if and .File .Site.Params.BookEditLink }}
      <a class="flex align-center" href="{{ partial "docs/links/edit" . }}" target="_blank" rel="noopener edit">
        <span>{{ partial "docs/text/i18n" "Edit this page" }}</span>
      </a>
    {{ end }}
  </div>
</div>
