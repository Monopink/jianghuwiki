# hugo server --minify --themesDir ... --baseURL=http://0.0.0.0:1313/theme/hugo-book/

baseURL = "https://www.jhwiki.com/"
theme = "hugo-book"

# Book configuration
disablePathToLower = true
enableGitInfo = true

# Site language
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

# Arrange the date in the order of the array
[frontmatter]
  lastmod = ['lastmod', 'modified', ':git', 'date', 'publishdate', 'pubdate', 'published']


# Needed for mermaid/katex shortcodes
[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.cjk]
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = 'normal'
  enable = true
  escapedSpace = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  anchorLineNos = true
  codeFences = true
  guessSyntax = false
  hl_Lines = ''
  hl_inline = false
  lineAnchors = ''
  lineNoStart = 1
  lineNos = false
  lineNumbersInTable = true
  noClasses = false
  noHl = false

# Chinese content configuration
[languages]
[languages.zh]
  label = "中文"
  locale = "zh"
  contentDir = "content.zh"
  title = "Jianghu Wiki"
  weight = 1

  [[languages.zh.params.menuFooter.links]]
    name = "随机开往另外个人网站"
    url = "https://www.travellings.cn/go.html"
    icon = ""

  [[languages.zh.params.menuFooter.links]]
    name = "萌 ICP 备 20246464 号"
    url = "https://icp.gov.moe/?keyword=20246464"
    icon = ""

[menu]
# [[menu.before]]
# [[menu.after]]
#  name = "Github"
#  url = "https://github.com/alex-shpak/hugo-book"
#  weight = 10

# [[menu.after]]
#  name = "Hugo Themes"
#  url = "https://themes.gohugo.io/hugo-book/"
#  weight = 20

[params]
  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme "auto" switches between dark and light modes based on browser/os preferences
  BookTheme = "auto"

  # (Optional, default true) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled with markup.tableOfContents setting.
  # You can also specify this parameter per page in front matter.
  BookToC = true

  # (Optional, default none) Set the path to a logo for the book. If the logo is
  # /static/logo.png then the path would be logo.png
  # BookLogo = "logo.png"

  # (Optional, default none) Set leaf bundle to render as side menu
  # When not specified file structure and weights will be used
  # BookMenuBundle = "/menu"

  # (Optional, default docs) Specify root page to render child pages as menu.
  # Page is resoled by .GetPage function: https://gohugo.io/functions/getpage/
  # For backward compatibility you can set "*" to render all sections to menu. Acts same as "/"
  BookSection = "*"

  # Links used by the current theme for page metadata actions.
  BookLastChangeLink = "https://github.com/Monopink/jianghuwiki/commit/{{ .GitInfo.Hash }}"
  BookEditLink = "https://github.com/Monopink/jianghuwiki/blob/master/{{ .Path }}"

  # Configure the date format used on the pages
  # - In git information
  # - In blog posts
  BookDateFormat = "2006-01-02"

  # (Optional, default true) Enables search function with MiniSearch,
  # Index is built on fly, therefore it might slowdown your website.
  # Configuration for indexing can be adjusted in i18n folder per language.
  BookSearch = true

  [params.favicon]
    provider = "https://favicon.im/%s"
    fallback = "favicon.png"

  # (Optional, default true) Enables comments template on pages
  # By default partals/docs/comments.html includes Disqus template
  # See https://gohugo.io/content-management/comments/#configure-disqus
  # Can be overwritten by same param in page frontmatter
  # BookComments = true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables portable links and link checks in markdown pages.
  # Portable links meant to work with text editors and let you write markdown without {{< relref >}} shortcode
  # Theme will print warning if page referenced in markdown does not exists.
  BookPortableLinks = true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables service worker that caches visited pages and resources for offline use.
  BookServiceWorker = true

  # /!\ This is an experimental feature, might be removed or changed at any time
# The third party search service by Algolia
[params.DocSearch]
  enabled = false
  appId = "TR1JS5XUQQ"
  apiKey = "65b41088a6c64941a701a3170fee3899"
  indexName = "jhcom"
  insights = true # Optional, automatically send insights when user interacts with search results
  container = "#docsearch"
  debug = false # Set debug to true if you want to inspect the modal
